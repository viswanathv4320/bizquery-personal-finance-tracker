<!-- html for the webpage, stylesheet found here: https://getbootstrap.com/docs/5.3/getting-started/download/  -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BizQuery Dashboard</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4 text-center">BizQuery - User Dashboard</h1>
    <!-- top of page should have monthly spending using template -->
    <div class="row mb-4">
      <div class="col-md-12">
        <h3>Monthly Spending (Month to Date)</h3>
        <table class="table table-bordered" id="monthlySpendingTable">
          <thead>
            <tr><th>Category</th><th>Total Spent</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    
    <!-- budget table showing current budgets -->
    <div class="row">
      <div class="col-md-6">
        <h3>Budgets</h3>
        <table class="table table-bordered" id="budgetTable">
          <thead>
            <tr><th>Category</th><th>Duration</th><th>Limit</th><th>Constraint</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <!-- recent transactions with filter on top and transactions on bottom -->
      <div class="col-md-6">
        <h3>Recent Transactions</h3>
        
        <!-- filter section -->
        <div class="card mb-3">
          <div class="card-body">
            <h6 class="card-title">Filter Transactions</h6>
            <form id="filterForm" class="row g-2">
              <div class="col-md-12">
                <input type="date" name="date" class="form-control form-control-sm" placeholder="Date" />
              </div>
              <div class="col-md-6">
                <input type="number" step="0.01" name="minAmount" class="form-control form-control-sm" placeholder="Min Amount" />
              </div>
              <div class="col-md-6">
                <input type="number" step="0.01" name="maxAmount" class="form-control form-control-sm" placeholder="Max Amount" />
              </div>
              <div class="col-md-6">
                <input type="text" name="paymentMethod" class="form-control form-control-sm" placeholder="Payment Method" />
              </div>
              <div class="col-md-6">
                <input type="number" name="categoryID" class="form-control form-control-sm" placeholder="Category ID" />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-sm w-100">Apply Filters</button>
                <button type="button" class="btn btn-secondary btn-sm w-100 mt-1" onclick="clearFilters()">Clear Filters</button>
              </div>
            </form>
          </div>
        </div>
        <!-- table with current transactions -->
        <table class="table table-bordered" id="transactionTable">
          <thead>
            <tr><th>Date</th><th>Amount</th><th>Method</th><th>Category</th><th>Notes</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    
    <hr>
    <!-- add transaction table -->
    <div class="row">
      <div class="col-md-6">
        <h4>Add Transaction</h4>
        <form id="transactionForm">
          <input type="date" name="date" class="form-control mb-2" required />
          <input type="number" step="0.01" name="amount" placeholder="Amount" class="form-control mb-2" required />
          <input type="text" name="paymentMethod" placeholder="Payment Method" class="form-control mb-2" required />
          <input type="text" name="notes" placeholder="Notes" class="form-control mb-2" />
          <input type="number" name="categoryID" placeholder="Category ID" class="form-control mb-2" />
          <button class="btn btn-primary w-100">Add Transaction</button>
        </form>
      </div>
      <!-- add budgets table -->
      <div class="col-md-6">
        <h4>Add Budget</h4>
        <form id="budgetForm">
          <input type="number" name="categoryID" placeholder="Category ID" class="form-control mb-2" required />
          <input type="text" name="duration" placeholder="Duration (e.g. Monthly)" class="form-control mb-2" required />
          <input type="number" step="0.01" name="budgetLimit" placeholder="Budget Limit" class="form-control mb-2" required />
          <input type="text" name="constraint" placeholder="Constraint (optional)" class="form-control mb-2" />
          <button class="btn btn-success w-100">Add Budget</button>
        </form>
      </div>
    </div>
    <!-- category table for user to reference -->
    <div class="row mb-4 mt-4">
      <div class="col-md-12">
        <h3>Categories</h3>
        <table class="table table-bordered" id="categoryTable">
          <thead>
            <tr><th>CategoryID</th><th>Category</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
